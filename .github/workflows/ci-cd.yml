name: Aegentix Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Security & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

  build-and-package:
    name: Production Compilation & Docker Build
    needs: audit-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegentix-sovereign-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-verification:
    name: Container Healthcheck Test
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Run Container Test
        run: |
          docker build -t aegentix-test .
          docker run -d --name test-node -p 3000:3000 aegentix-test
          sleep 5
          docker ps
          curl --fail http://localhost:3000/mcp/info || exit 1
          docker stop test-node
