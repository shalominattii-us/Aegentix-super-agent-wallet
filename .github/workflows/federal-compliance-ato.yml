name: Compliance Script Check (manual)

# Runs only when started by hand. It runs compliance_engine.py once and reports
# whatever that script returns. It makes no attestation and no compliance claim.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-compliance-script:
    name: Run compliance_engine.py
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run compliance_engine.py
        run: python3 compliance_engine.py
